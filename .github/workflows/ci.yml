name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check whispercrawler/

      - name: Ruff (format)
        run: ruff format --check whispercrawler/

      # `strict = true` is aspirational: the codebase currently reports ~1300 errors,
      # most of them in vendored parsing code. Reported for visibility, not enforced.
      # Drop `continue-on-error` once that count reaches zero.
      - name: Mypy (informational)
        run: mypy whispercrawler/ || true
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Advisories land independently of our changes, so a newly published CVE should
      # raise a signal rather than turn every unrelated PR red.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip install -e "."
          pip-audit --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev,fetchers,mcp]"

      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
          key: browsers-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      # The dynamic and stealth fetcher suites drive real browsers. Without these
      # binaries roughly 30 tests fail with "Executable doesn't exist".
      - name: Install browsers
        run: |
          python -m playwright install --with-deps chromium
          python -m camoufox fetch

      - name: Refresh TLD names
        run: python -c "from tld.utils import update_tld_names; update_tld_names(fail_silently=True)"

      - name: Run tests with coverage
        run: |
          pytest whispercrawler/tests \
            --cov=whispercrawler \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
