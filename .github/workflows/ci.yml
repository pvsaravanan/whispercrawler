name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check whispercrawler/

      - name: Ruff (format)
        run: ruff format --check whispercrawler/

      # `strict = true` is aspirational: the codebase currently reports ~1300 errors,
      # most of them in vendored parsing code. Reported for visibility, not enforced.
      # Drop `continue-on-error` once that count reaches zero.
      - name: Mypy (informational)
        run: mypy whispercrawler/ || true
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Advisories land independently of our changes, so a newly published CVE should
      # raise a signal rather than turn every unrelated PR red.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip install -e "."
          pip-audit --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev,fetchers,mcp]"

      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
          key: browsers-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      # The dynamic and stealth fetcher suites drive real browsers. Without these
      # binaries roughly 30 tests fail with "Executable doesn't exist".
      # patchright pins its own Chromium build and does not reuse Playwright's,
      # so the stealth engines need a separate install.
      - name: Install browsers
        run: |
          python -m playwright install --with-deps chromium
          python -m patchright install chromium
          python -m camoufox fetch

      # A few tests deliberately launch headed browsers, which need a display.
      - name: Install virtual display
        run: sudo apt-get install -y xvfb

      - name: Refresh TLD names
        run: python -c "from tld.utils import update_tld_names; update_tld_names(fail_silently=True)"

      # The coverage floor in pyproject only makes sense on the version that runs
      # the whole suite. Python 3.10/3.11 skip the 80 fixture-server tests (see
      # whispercrawler/tests/conftest.py), which lands them around 72% - a lower
      # number for a smaller suite, not a regression. They still fail on any test
      # failure; they just do not enforce the floor.
      - name: Run tests with coverage
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            xvfb-run -a pytest whispercrawler/tests \
              --cov=whispercrawler \
              --cov-report=term-missing \
              --cov-report=xml
          else
            xvfb-run -a pytest whispercrawler/tests \
              --cov=whispercrawler \
              --cov-report=term-missing \
              --cov-fail-under=0
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
