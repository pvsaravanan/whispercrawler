[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whispercrawler"
version = "0.1.1"
description = "An adaptive web scraping framework — fast, stealthy, and self-healing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saravanan P V" }]
keywords = ["scraping", "crawling", "web", "adaptive", "stealth", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Framework :: AsyncIO",
]

# WhisperCrawler configuration


dependencies = [
    "lxml>=5.2.0",
    "cssselect>=1.2.0",
    "w3lib>=2.1.0",
    "tld>=0.13",
    "msgspec>=0.18.0",
    "orjson>=3.10.0",
    "aiosqlite>=0.20.0",
    "markdownify>=0.13.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "ipython>=8.0.0",
]

[project.optional-dependencies]
fetchers = [
    "curl-cffi>=0.7.0",
    "playwright>=1.44.0",
    "patchright>=1.44.0",
    "camoufox[geoip]>=0.4.0",
]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Serves the local HTTP fixtures that the fetcher and CLI suites request;
    # imported at module scope, so a missing install is a collection error.
    "pytest-httpbin>=2.0.0",
    # pytest-httpbin does not constrain httpbin, and releases before 0.10.4 import
    # `parse_authorization_header`, which werkzeug removed in 2.3.
    "httpbin>=0.10.4",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
whispercrawler = "whispercrawler.cli:main"
whispercrawler-mcp = "whispercrawler.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["whispercrawler/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# E501: a large body of inherited long comments and docstrings sits above 100 chars.
# `ruff format` owns code width; rewrapping prose by hand is not worth the churn.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: names are imported to be re-exported, not used locally.
# `whispercrawler/__init__.py` resolves them lazily via `__getattr__`, so the
# TYPE_CHECKING block exists purely for IDEs and type checkers.
"**/__init__.py" = ["F401"]
# Deliberate compatibility shim: re-exports typing primitives (Dict, List,
# Optional, ...) under their legacy names for the rest of the package to import.
# Modernising them here would break every downstream `from core._types import Dict`.
"whispercrawler/core/_types.py" = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["whispercrawler"]
omit = ["whispercrawler/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
