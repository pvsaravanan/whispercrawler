[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whispercrawler"
version = "0.1.1"
description = "An adaptive web scraping framework — fast, stealthy, and self-healing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saravanan P V" }]
keywords = ["scraping", "crawling", "web", "adaptive", "stealth", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Framework :: AsyncIO",
]

# WhisperCrawler configuration


dependencies = [
    "lxml>=5.2.0",
    "cssselect>=1.2.0",
    "w3lib>=2.1.0",
    "tld>=0.13",
    "msgspec>=0.18.0",
    "orjson>=3.10.0",
    "aiosqlite>=0.20.0",
    "markdownify>=0.13.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "ipython>=8.0.0",
]

[project.optional-dependencies]
fetchers = [
    "curl-cffi>=0.7.0",
    # Upper bound is for Camoufox, which drives Firefox through Playwright's Node
    # driver. From 1.60.0 that driver reads `pageError.location.url` unguarded
    # (coreBundle.js, BrowserContext.Events.PageError); Camoufox's Firefox 135
    # sends a pageError with no `location`, so the driver dies and takes the fetch
    # with it - on any page carrying an uncaught JS error, which is most of them.
    # 1.62 breaks earlier still, on Browser.setDefaultViewport. 1.59.0 is the last
    # verified-good release. Raise this once Camoufox ships a newer Firefox base.
    # `patchright` is unaffected: it vendors its own driver and does not depend on
    # `playwright`, so StealthyFetcher keeps working regardless.
    "playwright>=1.44.0,<1.60",
    "patchright>=1.44.0",
    "camoufox[geoip]>=0.4.0",
]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Serves the local HTTP fixtures for the fetcher, CLI, and MCP suites.
    # Restricted to 3.12+: httpbin 0.10.4 pins greenlet<3.0 below that, which
    # collides with Playwright's greenlet>=3.1.1, and the older httpbin 0.10.0
    # needs `parse_authorization_header`, removed in werkzeug 2.3. The affected
    # modules are skipped where it is absent - see whispercrawler/tests/conftest.py.
    "pytest-httpbin>=2.0.0; python_version >= '3.12'",
    "httpbin>=0.10.4; python_version >= '3.12'",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
whispercrawler = "whispercrawler.cli:main"
whispercrawler-mcp = "whispercrawler.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["whispercrawler/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# E501: a large body of inherited long comments and docstrings sits above 100 chars.
# `ruff format` owns code width; rewrapping prose by hand is not worth the churn.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: names are imported to be re-exported, not used locally.
# `whispercrawler/__init__.py` resolves them lazily via `__getattr__`, so the
# TYPE_CHECKING block exists purely for IDEs and type checkers.
"**/__init__.py" = ["F401"]
# Deliberate compatibility shim: re-exports typing primitives (Dict, List,
# Optional, ...) under their legacy names for the rest of the package to import.
# Modernising them here would break every downstream `from core._types import Dict`.
"whispercrawler/core/_types.py" = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# `strict = true` is enforced in CI. The modules below predate that and are
# grandfathered in with the specific strictness codes they still violate, so the
# gate stays green while blocking *new* violations: anything not listed here -
# every new module, and the ~55 already-clean ones - is held to full strict mode.
# Shrink this list over time; when it is empty, delete this section.
[[tool.mypy.overrides]]
module = [
    "whispercrawler.cli",
    "whispercrawler.core.ai",
    "whispercrawler.core.captcha",
    "whispercrawler.core.custom_types",
    "whispercrawler.core.mixins",
    "whispercrawler.core.pagination",
    "whispercrawler.core.shell",
    "whispercrawler.core.storage",
    "whispercrawler.core.utils._shell",
    "whispercrawler.core.utils._utils",
    "whispercrawler.engines._browsers._base",
    "whispercrawler.engines._browsers._controllers",
    "whispercrawler.engines._browsers._page",
    "whispercrawler.engines._browsers._stealth",
    "whispercrawler.engines._browsers._toolbelt",
    "whispercrawler.engines._browsers._types",
    "whispercrawler.engines._browsers._validators",
    "whispercrawler.engines.static",
    "whispercrawler.engines.toolbelt.convertor",
    "whispercrawler.engines.toolbelt.custom",
    "whispercrawler.engines.toolbelt.fingerprints",
    "whispercrawler.engines.toolbelt.navigation",
    "whispercrawler.fetchers",
    "whispercrawler.fetchers.chrome",
    "whispercrawler.fetchers.shadow",
    "whispercrawler.fetchers.stealth_chrome",
    "whispercrawler.integrations.scrapy",
    "whispercrawler.mcp_server",
    "whispercrawler.parser",
    "whispercrawler.shell",
    "whispercrawler.spiders.engine",
    "whispercrawler.spiders.request",
    "whispercrawler.spiders.result",
    "whispercrawler.spiders.session",
    "whispercrawler.spiders.spider",
]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "has-type",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "redundant-cast",
    "type-arg",
    "untyped-decorator",
    "unused-ignore",
]

# The suite is exercised by running it, not by type checking it. Several tests
# also pass deliberately-invalid values to assert the validators reject them,
# which is precisely what a type checker is built to complain about. mypy's job
# here is to guard the shipped package.
[[tool.mypy.overrides]]
module = "whispercrawler.tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["whispercrawler"]
omit = ["whispercrawler/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
